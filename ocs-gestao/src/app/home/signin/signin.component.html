<div class="login-page">

    <div class="login-hero">
        <div class="login-hero-overlay">
            <h1>Caipira da Gema</h1>
            <p>Gestão completa da produção de ovos caipiras</p>
        </div>
    </div>

    <div class="wrapper fadeInDown">

        <div id="formContent">
        <!-- Tabs Titles -->

        <!-- Marca -->
        <div class="fadeIn first">
            <h2 class="brand-title">Caipira da Gema</h2>
            <p class="owner-name">Luis Ricardo Queiroz Silva</p>
        </div>

        <!-- Login Form -->
        <form #form="ngForm" [formGroup]="loginForm" (submit)="login()">
            <input type="text" id="login" formControlName="login"  class="fadeIn second" name="login" placeholder="login">
            <ocs-vmessage
                *ngIf="loginForm.get('login').errors?.required && form.submitted"
                text = "Informe o login"
            ></ocs-vmessage>
            <input type="password" id="password" formControlName="senha" class="fadeIn third" name="login" placeholder="senha">
            <ocs-vmessage
                *ngIf="loginForm.get('senha').errors?.required && form.submitted"
                text = "Senha inválida"
            ></ocs-vmessage>
            <input type="submit" class="fadeIn fourth" value="Entrar">
        </form>

        <!-- Remind Passowrd -->
        <div id="formFooter">

        </div>

        </div>

    </div>

</div>
