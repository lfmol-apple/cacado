<div class="main-content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header card-header-danger">
                <div class="card-title">
                  Fornecedor
                </div>
                <p class="card-category">Cadastro de Fornecedores
                </p>
            </div>
            <div class="card-body ">
                <form #form="ngForm" [formGroup]="formFornecedor" (submit)="salvaFornecedor()">
                    <div class="row">
                        <div class="col-12">
                            <div class="form-check form-check-radio">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="radio" name="exampleRadios" id="radioTipoPessoaJuridica" value="0" formControlName="TipoPessoa">
                                    Pessoa Jurídica
                                    <span class="circle">
                                        <span class="check"></span>
                                    </span>
                                </label>
                            </div>
                            <div class="form-check form-check-radio">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="radio" name="exampleRadios" id="radioTipoPessoaFisica" value="1" formControlName="TipoPessoa">
                                    Pessoa Física
                                    <span class="circle">
                                        <span class="check"></span>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12 col-md-2">
                            <mat-form-field >
                                <input matInput type="text" placeholder="{{formFornecedor?.value.TipoPessoa == '0'?'CNPJ':'CPF'}}" formControlName="NumDoc">
                                <mat-icon matSuffix class="btn-busca" *ngIf="formFornecedor?.value.TipoPessoa == '0' && this.idFornecedor == -1" (click)="consultaCnpj()"><i class="material-icons">search</i></mat-icon>
                            </mat-form-field>
                        </div>
                        <div class="col-sm-12 col-md-5" *ngIf="formFornecedor?.value.TipoPessoa == '0'">
                            <mat-form-field >
                                <input matInput type="text" placeholder="Razão Social" formControlName="RazaoSocial">
                                <mat-error *ngIf="this.formFornecedor.get('RazaoSocial').errors?.razaoSocialExists">Já existe fornecedor com esta Razão Social cadastrada</mat-error>
                            </mat-form-field>
                        </div>
                        <div class="col-sm-12" [ngClass]="{'col-md-5': formFornecedor?.value.TipoPessoa == '0','col-md-10': formFornecedor?.value.TipoPessoa == '1'}">
                            <mat-form-field >
                                <input matInput type="text" placeholder="{{formFornecedor?.value.TipoPessoa == '0'?'Nome Fantasia':'Nome'}}" formControlName="Nome">
                                <mat-error *ngIf="this.formFornecedor.get('Nome').errors?.required && form.submitted">Informe o nome do fornecedor</mat-error>
                                <mat-error *ngIf="this.formFornecedor.get('Nome').errors?.nomeExists">Já existe fornecedor com este nome cadastrado</mat-error>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-2">
                            <mat-form-field>
                                <input matInput type="text" placeholder="CEP" formControlName="CEP">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-7">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Endereço" formControlName="Endereco">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-3">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Complemento" formControlName="Complemento">
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Bairro" formControlName="Bairro">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-5">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Cidade" formControlName="Cidade">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-1">
                            <mat-form-field>
                                <input matInput type="text" placeholder="UF" formControlName="UF">
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-4">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Email" formControlName="Email">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-3">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Telefone" formControlName="Telefone">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-3">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Celular" formControlName="Celular">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-check">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="checkbox" value="" formControlName="Whatsapp">
                                    Whatsapp
                                    <span class="form-check-sign">
                                        <span class="check"></span>
                                    </span>
                                </label>
                            </div>                    
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Contato" formControlName="NomeContato">
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <mat-form-field >
                                <textarea matInput placeholder="Observações" formControlName="Obs"></textarea>
                            </mat-form-field>                         
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="form-check">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="checkbox" value="1" formControlName="Ativo">
                                    Ativo
                                    <span class="form-check-sign">
                                        <span class="check"></span>
                                    </span>
                                </label>
                            </div>                    
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <button type="submit" class="btn btn-success">Salvar</button>
                            <button type="button" class="btn btn-white" (click)="cancelar()">Cancelar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
  </div>
