<div class="main-content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header card-header-danger">
                <div class="card-title">
                  Clientes
                  <button mat-raised-button class="btn btn-danger pull-right btn-sm" (click)="novoCliente()"><i class="material-icons">add</i>Novo</button>
                </div>
                <p class="card-category">Cadastro de Clientes
                </p>
            </div>
            <div class="card-content table-responsive table-full-width">
                <table class="table">
                  <thead class="text-danger">
                    <th>Documento</th>
                    <th>Nome</th>
                    <th>Editar</th>
                  </thead>
                  <tbody>
                    <tr *ngFor="let cliente of Clientes">
                      <td>{{cliente.NumDoc}}</td>
                      <td>{{cliente.Nome}}</td>
                      <td (click)="editaCliente(cliente.ID)" ><i class="material-icons edit-cliente">edit_note</i></td>
                    </tr>
                  </tbody>
                </table>
              </div>
        </div>
    </div>
  </div>
