<div class="main-content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header card-header-danger">
                <div class="card-title">
                  Usuários
                  <button mat-raised-button id="btnNovo"class="btn btn-danger pull-right btn-sm" (click)="novoUsuario()"><i class="material-icons">add</i>Novo</button>
                </div>
                <p class="card-category">Cadastro de Usuários
                </p>
            </div>
            <div id="listaUsuarios" class="card-content table-responsive table-full-width">
                <table class="table">
                  <thead class="text-danger">
                    <th>Grupo</th>
                    <th>Nome</th>
                    <th>Editar</th>
                  </thead>
                  <tbody>
                    <tr *ngFor="let usuario of usuarios">
                        <td>{{usuario.NomeGrupoUsuarios}}</td>
                        <td>{{usuario.Nome}}</td>
                        <td (click)="editaUsuario(usuario)" ><i class="material-icons edit-grupo">edit_note</i></td>
                    </tr>
                  </tbody>
                </table>
            </div>
            <div id="editUsuarios" class="display-hide panel-margin">
                <form #form="ngForm" [formGroup]="formUsuario" (submit)="salvaUsuario()">
                    <div class="row">
                        <div class="col-sm-6">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Nome" formControlName="Nome">
                                <mat-error *ngIf="this.formUsuario.get('Nome').errors?.required && form.submitted">Informe o nome do usuário</mat-error>
                            </mat-form-field>   
                       </div>
                       <div class="col-sm-6">
                            <mat-form-field>
                                <input matInput type="text" placeholder="Login" formControlName="Login">
                                <mat-error *ngIf="this.formUsuario.get('Login').errors?.required && form.submitted">Informe o login do Usuário</mat-error>
                            </mat-form-field>   
                        </div>
                   </div>
                   <div class="row">
                        <div class="col-sm-12">
                            <mat-form-field>
                                <mat-label>Grupo</mat-label>
                                <mat-select formControlName="IDGrupo_Usuarios">
                                <mat-option *ngFor="let grupo of grupos_usuario" [value]="grupo.ID"  >
                                    {{grupo.Nome}}
                                </mat-option>
                                </mat-select>
                                <mat-error *ngIf="this.formUsuario.get('IDGrupo_Usuarios').errors?.required && form.submitted">Informe o grupo de usuários</mat-error>
                            </mat-form-field>                            
                        </div>                    
                   </div>
                   <div class="row" *ngIf="this.idUsuario != -1 && !this.showSenhas">
                    <div class="col-sm-12">
                        <button type="button" class="btn btn-block btn-danger" (click)="habilitaAlterarSenha()">Alterar Senha</button>
                    </div>
                   </div>
                   <div class="row" id="linhaSenhas" *ngIf="this.idUsuario == -1 || this.showSenhas">
                        <div class="col-sm-6">
                            <mat-form-field>
                                <input matInput type="password" placeholder="Senha" formControlName="Senha">
                                <mat-error *ngIf="this.formUsuario.get('Senha').errors?.required && form.submitted">Senha Inválida</mat-error>
                            </mat-form-field>   
                        </div>                    
                        <div class="col-sm-6">
                            <mat-form-field>
                                <input matInput type="password" placeholder="Confirmação de Senha" formControlName="ConfirmaSenha">
                                <mat-error *ngIf="this.formUsuario.get('ConfirmaSenha').errors?.required">Senha inválida</mat-error>
                            </mat-form-field>   
                        </div>     
                        <div class="row panel-margin" *ngIf="this.showSenhas == true">
                            <div class="col-sm-12">
                                <button type="button" class="btn btn-default pull-right" (click)="this.showSenhas = false">Cancelar</button>
                                <button type="button" class="btn btn-success pull-right" (click)="alteraSenha()">Alterar Senha</button>
                            </div>
                        </div>
                   </div>
                   <div class="row">
                        <div class="col-sm-2">
                            <div class="form-check">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="checkbox" value="1" formControlName="Ativo">
                                    Ativo
                                    <span class="form-check-sign">
                                        <span class="check"></span>
                                    </span>
                                </label>
                            </div>    
                        </div>  
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <button type="button" class="btn btn-default pull-right" (click)="cancelaEdit()">Cancelar</button>
                            <button type="submit" class="btn btn-success pull-right">Salvar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
  </div>
